services:
  mysql:
    image: mysql:8.4
    container_name: dev-mysql
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_ROOT_HOST: "%"
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init/mysql:/docker-entrypoint-initdb.d:ro # <— tambahkan ini
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -uroot --silent" ]
      interval: 5s
      timeout: 3s
      retries: 30

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest # <— pakai repo resmi
    container_name: dev-phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      UPLOAD_LIMIT: 128M
    depends_on:
      - mysql
    ports:
      - "127.0.0.1:8081:80"

  postgres:
    image: postgres:15-alpine
    container_name: dev-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: dev
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d dev" ]
      interval: 3s
      timeout: 3s
      retries: 10

  pgweb:
    image: sosedoff/pgweb
    container_name: dev-pgweb
    restart: always
    # Retry kalau DB target belum siap / sedang mati. Tanpa ini pgweb langsung
    # exit dan `restart: always` bikin container crash-loop tiap 3 detik.
    # Argumen ini DITAMBAHKAN ke entrypoint image:
    #   /usr/bin/pgweb --bind=0.0.0.0 --listen=8081 <argumen di bawah>
    command: [ "--open-retry=100", "--open-retry-delay=3" ]
    ports:
      - "8082:8081" # Saya taruh di 8082 agar tidak bentrok dengan phpmyadmin (8081)
    environment:
      # Auto-connect string — tidak perlu input password lagi di browser.
      # Kredensial ada di ./.env (tidak ikut ter-commit), lihat .env.example.
      - PGWEB_DATABASE_URL=${PGWEB_DATABASE_URL}
    # depends_on sengaja dilepas: target DB saat ini di LUAR compose ini
    # (host.docker.internal). Kalau balik menunjuk service `postgres` di file
    # ini, aktifkan lagi blok berikut supaya urutan start-nya benar:
    # depends_on:
    #   postgres:
    #     condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: dev-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_dev_data:/data
    command: [ "redis-server", "--appendonly", "yes" ]
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10

  redis-insight:
    image: redis/redisinsight:latest
    container_name: dev-redis-insight
    ports:
      - "5540:5540"
    volumes:
      - redis_insight_data:/data
    depends_on:
      - redis

  minio:
    image: minio/minio:latest
    container_name: dev-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "127.0.0.1:9000:9000" # S3 API
      - "127.0.0.1:9001:9001" # MinIO Console (Web UI)
    volumes:
      - minio_dev_data:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 5s
      timeout: 3s
      retries: 10

  unleash-postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: unleash
      POSTGRES_USER: unleash_user
      POSTGRES_PASSWORD: password123
    volumes:
      - postgres_unleash_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "--username=unleash_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Unleash Server
  unleash:
    image: unleashorg/unleash-server:latest
    ports:
      - "4242:4242"
    environment:
      # Koneksi ke Database
      DATABASE_HOST: unleash-postgres
      DATABASE_NAME: unleash
      DATABASE_USERNAME: unleash_user
      DATABASE_PASSWORD: password123
      DATABASE_SSL: "false"
      
      # Matikan demo authentication agar langsung login sebagai Admin
      # (Hanya untuk development lokal!)
      AUTH_TYPE: "demo" 
    depends_on:
      unleash-postgres:
        condition: service_healthy

  # ── 9Router (AI coding gateway) — LOKAL, OFF by default ───────────────────
  # ON      : docker compose up -d 9router     (hanya service ini, yg lain tidak ikut)
  # OFF     : docker compose stop 9router
  # ON lagi : docker compose start 9router
  # Hapus   : docker compose rm -sf 9router     (data tetap aman di volume 9router_local_data)
  # Dashboard: http://localhost:20128   (login: password saja, lihat .env)
  # Secret ada di ./.env (NINEROUTER_*), tidak ikut ter-commit.
  9router:
    image: decolua/9router:latest
    container_name: 9router
    profiles: [ "9router" ]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${NINEROUTER_PORT:-20128}:20128"
    volumes:
      - 9router_local_data:/app/data
    environment:
      DATA_DIR: /app/data
      PORT: "20128"
      HOSTNAME: "0.0.0.0"
      NODE_ENV: production
      JWT_SECRET: "${NINEROUTER_JWT_SECRET}"
      INITIAL_PASSWORD: "${NINEROUTER_INITIAL_PASSWORD}"
      API_KEY_SECRET: "${NINEROUTER_API_KEY_SECRET}"
      MACHINE_ID_SALT: "${NINEROUTER_MACHINE_ID_SALT}"
      AUTH_COOKIE_SECURE: "false"
      REQUIRE_API_KEY: "${NINEROUTER_REQUIRE_API_KEY:-true}"
      BASE_URL: "http://localhost:${NINEROUTER_PORT:-20128}"
      NEXT_PUBLIC_BASE_URL: "http://localhost:${NINEROUTER_PORT:-20128}"
      CLOUD_URL: "https://9router.com"

volumes:
  mysql_data:
  postgres_dev_data:
  redis_dev_data:
  minio_dev_data:
  postgres_unleash_dev_data:
  redis_insight_data:
  9router_local_data:
    name: 9router_local_data

